<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WebRebol: paint</title>
    <style>
      body { font-family: Arial, Helvetica, sans-serif; margin: 12px; background: #20232a; color: #e0e0e0; }
      #screen { position: relative; height: 570px; background: #2c313c; border: 1px solid #555555; margin: 8px 0; overflow: hidden; }
      #script { width: 100%; height: 220px; font-family: monospace; font-size: 12px; box-sizing: border-box; background: #16181d; color: #c8e1ff; }
      #output { background: #101216; color: #ffb4b4; padding: 8px; min-height: 20px; white-space: pre-wrap; margin: 0; }
      details { margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>Paint</h1>
    <p>Click a color, select a tool and a brush size, and draw on the white area with the mouse. The picture is an image! value of REBOL. The Fill tool fills an area, and a button saves the picture as a PNG file.</p>
    <div id="screen"></div>
    <pre id="output"></pre>
    <details>
      <summary>The REBOL script of this page</summary>
      <textarea id="script" spellcheck="false">color: 0.0.0 size: 4 tool: &#x27;brush last: none
picture: make image! [520x300 255.255.255]
pick-color: func [new] [color: new swatch/color: new show swatch]
pick-tool: func [new] [tool: new mode/text: form new show mode]
palette: [0.0.0 255.255.255 220.40.40 240.140.20 250.210.30 60.170.70 40.110.220 150.70.200 120.80.40 130.130.130]
spec: copy [
    across
    h2 &quot;WebRebol paint&quot;
    return
]
foreach shade palette [
    append spec compose/deep [box 28x28 (shade) [pick-color (shade)]]
]
append spec [
    return
    button 60 &quot;Brush&quot; [pick-tool &#x27;brush]
    button 60 &quot;Fill&quot; [pick-tool &#x27;fill]
    button 60 &quot;Eraser&quot; [pick-color 255.255.255 pick-tool &#x27;brush]
    mode: text 50x24 &quot;brush&quot;
    button 34 &quot;2&quot; [size: 2]
    button 34 &quot;6&quot; [size: 6]
    button 34 &quot;14&quot; [size: 14]
    swatch: box 28x24 0.0.0
    return
    canvas: box 520x300 css [cursor &quot;crosshair&quot; touch-action &quot;none&quot;] feel [
        engage: func [face action event] [
            if action = &#x27;down [
                either tool = &#x27;fill [
                    draw picture reduce [&#x27;pen color &#x27;flood event/offset]
                ] [
                    last: event/offset
                    draw picture reduce [&#x27;pen color &#x27;line-width size &#x27;line last last]
                ]
                show face
            ]
            if all [last action = &#x27;over] [
                draw picture reduce [&#x27;pen color &#x27;line-width size &#x27;line last event/offset]
                last: event/offset
                show face
            ]
            if action = &#x27;up [last: none]
        ]
    ]
    return
    button 80 &quot;Clear&quot; [draw picture [pen 255.255.255 box 0x0 519x299] show canvas]
    button 110 &quot;Save as PNG&quot; [download-image canvas &quot;painting.png&quot;]
    button 110 &quot;Count red&quot; [
        copy-picture: to-image canvas
        count: 0
        foreach pixel copy-picture [if pixel/1 &gt; 200 [if pixel/2 &lt; 90 [count: count + 1]]]
        status/text: rejoin [count &quot; red pixels&quot;]
        show status
    ]
    status: text 180x24 &quot;&quot;
]
window: layout spec
canvas/image: picture
view window</textarea>
      <button id="run">Run again</button>
    </details>
    <script type="module" src="../../src/edge/page.mjs"></script>
  </body>
</html>
