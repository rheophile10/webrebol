<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WebRebol: reveals</title>
    <style>
      body { font-family: Arial, Helvetica, sans-serif; margin: 12px; background: #20232a; color: #e0e0e0; }
      #screen { position: relative; height: 420px; background: #2c313c; border: 1px solid #555555; margin: 8px 0; overflow: hidden; }
      #script { width: 100%; height: 260px; font-family: monospace; font-size: 12px; box-sizing: border-box; background: #16181d; color: #c8e1ff; }
      #output { background: #101216; color: #ffb4b4; padding: 8px; min-height: 20px; white-space: pre-wrap; margin: 0; }
      .wr-box { color: #ffffff; font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>Reveals</h1>
    <p>The eight cell animations of the animations project, with the times of the cells calculated in REBOL. Click a card to play its reveal again.</p>
    <div id="screen"></div>
    <pre id="output"></pre>
    <details>
      <summary>The REBOL script of this page</summary>
      <textarea id="script" spellcheck="false">names: [dissolve wipe blinds ripple melt sweep glitch burn]
cards: copy []
play: func [card] [
    card/effect/run: 1 + select card/effect &#x27;run
    show card
]
spec: copy [across]
count: 0
foreach name names [
    append spec compose/deep [
        box 200x150 20.24.36 [play face-of (to-lit-word name)]
    ]
    count: count + 1
    if count // 4 = 0 [append spec &#x27;return]
]
face-of: func [name] [pick cards index? find names name]
sampler: layout spec
foreach card sampler/pane [append cards card]
repeat index length? names [
    card: pick cards index
    card/text: form pick names index
    card/effect: make-reveal pick names index 50x38 90.60.160
]
view sampler</textarea>
      <button id="run">Run again</button>
    </details>
    <script type="module" src="../../src/edge/page.mjs"></script>
  </body>
</html>
