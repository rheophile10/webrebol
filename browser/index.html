<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WebRebol</title>
    <style>
      body { font-family: Arial, Helvetica, sans-serif; margin: 12px; background: #f4f4f4; }
      #script { width: 100%; height: 190px; font-family: monospace; font-size: 13px; box-sizing: border-box; }
      #screen { position: relative; height: 420px; background: #ffffff; border: 1px solid #999999; margin: 8px 0; overflow: auto; }
      #output { background: #1e1e1e; color: #e0e0e0; padding: 8px; min-height: 40px; white-space: pre-wrap; margin: 0; }
    </style>
  </head>
  <body>
    <textarea id="script" spellcheck="false"></textarea>
    <button id="run">Run</button>
    <div id="screen"></div>
    <pre id="output"></pre>
    <script type="module" src="../src/edge/page.mjs"></script>
  </body>
</html>
